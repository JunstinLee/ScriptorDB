[project]
name = "scriptordb"
version = "0.1.0"
description = "LLM-powered database operator"
requires-python = ">=3.10"
dependencies = [
    "pydantic-ai-slim[openai]>=1.106",
    "typer>=0.25",
    "keyring>=25.0",
    "rich>=15.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "matplotlib>=3.10",
    "psutil>=5.9",
    "platformdirs>=4.0",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "dbutils>=3.0",
    "pypdf>=6.15.0",
    "pywebview>=6.2.1",
]

[project.optional-dependencies]
# Visible browser automation + WebRTC viewport streaming.
# numpy/pillow come in transitively via matplotlib.
browser = [
    "playwright>=1.61",
    "aiortc>=1.9.0",
    "av>=12.0.0",
]
# Web crawling (headless Chromium render + HTML-to-markdown + schema extraction).
crawl = [
    "playwright>=1.61",
    "markdownify>=1.1",
    "beautifulsoup4>=4.13",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.4",
    "reportlab>=5.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "slow: integration tests that require real external services (browser, network)",
]

[tool.pylance]
venvPath = "."
venv = ".venv"
